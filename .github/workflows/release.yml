name: Release

on:
  push:
    tags:
      - 'v[0-9]+.*'

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build (${{ matrix.target }})
        run: cross build --release --target ${{ matrix.target }}

      - name: Package binary
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/ai-api-bridge"
          tar -czf "ai-api-bridge-${{ matrix.target }}.tar.gz" -C "$(dirname "$binary")" "$(basename "$binary")"

      - uses: actions/upload-artifact@v4
        with:
          name: ai-api-bridge-${{ matrix.target }}
          path: ai-api-bridge-${{ matrix.target }}.tar.gz

  docker:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: ai-api-bridge-*
          merge-multiple: true

      - name: Generate changelog
        run: |
          prev_tag=$(git tag --sort=-creatordate | head -2 | tail -1)
          if [ -n "$prev_tag" ]; then
            git log "${prev_tag}..HEAD" --pretty=format:'- %s' > CHANGELOG.txt
          else
            git log --pretty=format:'- %s' > CHANGELOG.txt
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: ai-api-bridge-*.tar.gz
          body_path: CHANGELOG.txt
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
