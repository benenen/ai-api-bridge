<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ai-api-bridge · control plane</title>
<style>
  /* ─────────────────────────────────────────────────────────────
     ai-api-bridge admin — "signal room" ops console.
     Single self-contained file, no runtime CDN (works offline).
     Monospace-dominant by design: this is a control plane, not a
     marketing page. Distinctiveness comes from layout, the signal
     palette, hairline grid + grain, and orchestrated motion.
     All dynamic content is built via textContent (no innerHTML).
  ───────────────────────────────────────────────────────────── */
  :root {
    --bg:        #080b11;
    --bg-2:      #0c111a;
    --panel:     #0f1622;
    --panel-2:   #131c2b;
    --raised:    #18222f;
    --line:      rgba(150, 180, 220, 0.10);
    --line-soft: rgba(150, 180, 220, 0.055);
    --ink:       #cdd7e3;
    --ink-bold:  #eef3f9;
    --dim:       #5d6b80;
    --dimmer:    #3c485a;
    --accent:    #46e6c9;      /* signal cyan-green */
    --accent-dk: #0e3b36;
    --live:      #43d17a;
    --low:       #e7b53c;
    --down:      #f8615a;
    --idle:      #566377;
    --pending:   #6ea8ff;
    --shadow:    0 24px 60px -20px rgba(0,0,0,0.75), 0 4px 14px -6px rgba(0,0,0,0.6);
    --mono: ui-monospace, "JetBrains Mono", "SF Mono", "Cascadia Code",
            "Fira Code", "Roboto Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: var(--mono);
    background: var(--bg);
    color: var(--ink);
    font-size: 13px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    letter-spacing: 0.1px;
    position: relative;
    overflow-x: hidden;
  }

  /* layered atmosphere: hairline grid + top glow + grain */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -2; pointer-events: none;
    background:
      radial-gradient(1100px 500px at 78% -8%, rgba(70,230,201,0.10), transparent 60%),
      radial-gradient(900px 600px at 12% 4%, rgba(110,168,255,0.06), transparent 55%),
      linear-gradient(var(--line-soft) 1px, transparent 1px) 0 0 / 100% 34px,
      linear-gradient(90deg, var(--line-soft) 1px, transparent 1px) 0 0 / 34px 100%,
      var(--bg);
  }
  body::after {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    opacity: 0.035; mix-blend-mode: screen;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  /* ── masthead ───────────────────────────────────────────────── */
  .masthead {
    position: sticky; top: 0; z-index: 40;
    display: flex; align-items: center; gap: 18px;
    padding: 16px 28px;
    background: linear-gradient(180deg, rgba(8,11,17,0.92), rgba(8,11,17,0.74));
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: baseline; gap: 12px; }
  .brand .mark { font-weight: 700; font-size: 15px; letter-spacing: 2px; color: var(--ink-bold); }
  .brand .mark b { color: var(--accent); font-weight: 700; }
  .brand .sub { font-size: 10.5px; letter-spacing: 3px; text-transform: uppercase; color: var(--dim); }
  .signal { display: inline-flex; align-items: flex-end; gap: 2px; height: 12px; margin-left: 2px; }
  .signal i { width: 3px; background: var(--accent); border-radius: 1px; animation: bars 1.4s ease-in-out infinite; opacity: 0.85; }
  .signal i:nth-child(1){ height: 4px;  animation-delay: 0s; }
  .signal i:nth-child(2){ height: 8px;  animation-delay: .18s; }
  .signal i:nth-child(3){ height: 12px; animation-delay: .36s; }
  @keyframes bars { 0%,100%{ transform: scaleY(.45); opacity:.5 } 50%{ transform: scaleY(1); opacity:1 } }

  .masthead .spacer { flex: 1; }
  .auth-chip {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 11px; letter-spacing: 1px; color: var(--dim);
    padding: 7px 12px; border: 1px solid var(--line);
    background: var(--panel); border-radius: 7px; cursor: pointer;
    transition: border-color .18s, color .18s, background .18s;
  }
  .auth-chip:hover { border-color: rgba(70,230,201,0.4); color: var(--ink); }
  .auth-chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dimmer); }
  .auth-chip.set .dot { background: var(--live); box-shadow: 0 0 8px var(--live); }

  /* ── layout ─────────────────────────────────────────────────── */
  main { max-width: 1160px; margin: 0 auto; padding: 34px 28px 96px; }
  section { margin-bottom: 46px; animation: rise .6s cubic-bezier(.2,.7,.2,1) both; }
  section:nth-of-type(2){ animation-delay: .08s; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  .sec-head { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
  .sec-head .idx {
    font-size: 11px; color: var(--accent); letter-spacing: 2px;
    border: 1px solid var(--accent-dk); background: rgba(70,230,201,0.05);
    padding: 3px 8px; border-radius: 5px;
  }
  .sec-head h2 { margin: 0; font-size: 14px; letter-spacing: 3px; text-transform: uppercase; color: var(--ink-bold); font-weight: 600; }
  .sec-head .count { font-size: 11px; color: var(--dim); letter-spacing: 1px; }
  .sec-head .rule { flex: 1; height: 1px; background: linear-gradient(90deg, var(--line), transparent); }

  button.add {
    font-family: var(--mono); font-size: 11.5px; letter-spacing: 1px;
    color: var(--accent); background: rgba(70,230,201,0.06);
    border: 1px solid rgba(70,230,201,0.32); border-radius: 7px;
    padding: 8px 14px; cursor: pointer; transition: all .16s;
  }
  button.add:hover { background: rgba(70,230,201,0.14); box-shadow: 0 0 0 1px rgba(70,230,201,0.2); }
  button.add:active { transform: translateY(1px); }

  /* ── provider cards ─────────────────────────────────────────── */
  .grid { display: grid; gap: 12px; }
  .card {
    position: relative;
    border: 1px solid var(--line); border-radius: 12px;
    background: linear-gradient(180deg, rgba(255,255,255,0.018), transparent 40%), var(--panel);
    padding: 16px 18px; overflow: hidden;
    transition: border-color .2s, transform .2s, box-shadow .2s;
  }
  .card:hover { border-color: rgba(150,180,220,0.22); transform: translateY(-2px); box-shadow: var(--shadow); }
  .card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--seam, var(--dimmer)); opacity: .9; }
  .card .top { display: flex; align-items: center; gap: 12px; }
  .pill {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 10.5px; letter-spacing: 1.4px; font-weight: 600;
    padding: 4px 10px 4px 8px; border-radius: 20px; white-space: nowrap;
    border: 1px solid currentColor;
  }
  .pill .led { width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; }
  .pill.live   { color: var(--live);   background: rgba(67,209,122,0.08); }
  .pill.live .led { animation: pulse 1.8s ease-in-out infinite; }
  .pill.low    { color: var(--low);    background: rgba(231,181,60,0.08); }
  .pill.down   { color: var(--down);   background: rgba(248,97,90,0.09); }
  .pill.pending{ color: var(--pending);background: rgba(110,168,255,0.08); }
  .pill.idle   { color: var(--idle);   background: rgba(86,99,119,0.08); }
  @keyframes pulse { 0%,100%{ opacity: 1 } 50%{ opacity: .35 } }

  .card .name { font-size: 15px; font-weight: 700; color: var(--ink-bold); letter-spacing: .5px; }
  .wire-tag { font-size: 10px; letter-spacing: 1px; color: var(--dim); border: 1px solid var(--line); border-radius: 5px; padding: 2px 7px; text-transform: uppercase; }
  .card .actions { margin-left: auto; display: flex; gap: 6px; opacity: 0; transition: opacity .18s; }
  .card:hover .actions { opacity: 1; }
  .icon-btn {
    font-family: var(--mono); font-size: 11px; letter-spacing: .5px;
    color: var(--dim); background: transparent; border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 10px; cursor: pointer; transition: all .15s;
  }
  .icon-btn:hover { color: var(--ink); border-color: var(--dim); }
  .icon-btn.danger:hover { color: var(--down); border-color: rgba(248,97,90,0.5); background: rgba(248,97,90,0.07); }

  .card .meta { margin-top: 12px; display: grid; grid-template-columns: 1fr; gap: 8px; }
  .urlrow { display: flex; align-items: center; gap: 10px; color: var(--dim); font-size: 12px; }
  .urlrow .url { color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 10.5px; letter-spacing: .5px; color: var(--dim); border: 1px solid var(--line-soft); background: var(--bg-2); padding: 2px 8px; border-radius: 5px; }
  .chip b { color: var(--ink); font-weight: 600; }

  .quota { margin-top: 12px; }
  .quota .lbl { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--dim); letter-spacing: 1px; margin-bottom: 5px; }
  .quota .lbl b { color: var(--ink); font-weight: 600; }
  .bar { height: 6px; border-radius: 4px; background: var(--bg-2); border: 1px solid var(--line-soft); overflow: hidden; }
  .bar > span { display: block; height: 100%; border-radius: 4px; transition: width .5s cubic-bezier(.2,.7,.2,1); }
  .bar > span.live { background: linear-gradient(90deg, #2ba85e, var(--live)); }
  .bar > span.low  { background: linear-gradient(90deg, #b88a1d, var(--low)); }
  .bar > span.down { background: linear-gradient(90deg, #c23b35, var(--down)); }
  .last { font-size: 10.5px; color: var(--dimmer); letter-spacing: 1px; margin-top: 9px; }
  .err-note { margin-top: 9px; font-size: 11px; color: var(--down); letter-spacing: .3px; word-break: break-word; }

  .cost { margin-top: 12px; }
  .cost-head { font-size: 10px; letter-spacing: 2px; color: var(--dim); margin-bottom: 7px; }
  .cost-row { margin-bottom: 8px; }
  .cost-row .lbl { display: flex; justify-content: space-between; gap: 8px; font-size: 10.5px; color: var(--dim); letter-spacing: .5px; margin-bottom: 4px; }
  .cost-row .lbl b { color: var(--ink); font-weight: 600; }
  .cost-row .cw-label { color: var(--accent); font-weight: 600; min-width: 34px; }
  .cost-row .cw-reset { color: var(--dimmer); }

  /* ── routes ─────────────────────────────────────────────────── */
  .route { display: flex; align-items: center; gap: 14px; border: 1px solid var(--line); border-radius: 11px; background: var(--panel); padding: 14px 18px; transition: border-color .2s, transform .2s, box-shadow .2s; }
  .route:hover { border-color: rgba(150,180,220,0.22); transform: translateY(-2px); box-shadow: var(--shadow); }
  .route .alias { font-size: 14px; font-weight: 700; color: var(--accent); letter-spacing: .5px; min-width: 150px; }
  .arrow { color: var(--dimmer); }
  .target { display: flex; align-items: center; gap: 8px; }
  .target .prov { color: var(--ink-bold); font-weight: 600; }
  .target .model { color: var(--dim); }
  .fallbacks { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .fb { font-size: 10.5px; color: var(--dim); letter-spacing: .3px; border: 1px dashed var(--line); border-radius: 14px; padding: 3px 9px; }
  .fb b { color: var(--ink); font-weight: 600; }
  .route .actions { margin-left: auto; display: flex; gap: 6px; opacity: 0; transition: opacity .18s; }
  .route:hover .actions { opacity: 1; }

  .empty { border: 1px dashed var(--line); border-radius: 12px; padding: 30px; text-align: center; color: var(--dim); font-size: 12.5px; letter-spacing: .5px; }
  .empty .hint { font-family: system-ui, sans-serif; color: var(--dimmer); margin-top: 6px; font-size: 12px; }
  .loading { color: var(--dim); font-size: 12px; letter-spacing: 1px; padding: 20px 4px; }

  /* ── modal ──────────────────────────────────────────────────── */
  .scrim {
    position: fixed; inset: 0; z-index: 60; display: none;
    align-items: flex-start; justify-content: center; padding: 6vh 20px 40px;
    background: rgba(4,6,10,0.66); backdrop-filter: blur(4px); overflow-y: auto;
  }
  .scrim.open { display: flex; animation: fade .2s ease both; }
  @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
  .modal {
    width: 100%; max-width: 720px; position: relative;
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
    animation: pop .26s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(16px) scale(.99) } to { opacity: 1; transform: none } }
  .modal::before { content:""; position:absolute; left:18px; right:18px; top:0; height:1px; background: linear-gradient(90deg, transparent, var(--accent), transparent); opacity:.6; }
  .modal h3 { margin: 0; padding: 18px 22px; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: var(--ink-bold); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
  .modal h3 .tag { font-size: 10px; color: var(--accent); border: 1px solid var(--accent-dk); padding: 2px 7px; border-radius: 4px; letter-spacing: 1px; }
  .modal .body { padding: 20px 22px; }
  .field { margin-bottom: 15px; }
  .field.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  label { display: block; font-size: 10.5px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--dim); margin-bottom: 6px; }
  label .opt { color: var(--dimmer); text-transform: none; letter-spacing: .3px; }
  input, select, textarea {
    width: 100%; font-family: var(--mono); font-size: 13px; color: var(--ink);
    background: var(--bg-2); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; outline: none; transition: border-color .15s, box-shadow .15s;
  }
  input::placeholder, textarea::placeholder { color: var(--dimmer); }
  input:focus, select:focus, textarea:focus { border-color: rgba(70,230,201,0.55); box-shadow: 0 0 0 3px rgba(70,230,201,0.1); }
  input:disabled { color: var(--dim); background: var(--panel); cursor: not-allowed; }
  textarea { resize: vertical; min-height: 64px; line-height: 1.45; }

  /* ── probe source toggle ────────────────────────────── */
  .src-toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
  .src-toggle button {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.8px;
    padding: 6px 16px; border: none; background: var(--panel);
    color: var(--dim); cursor: pointer; transition: all .15s;
  }
  .src-toggle button:first-child { border-right: 1px solid var(--line); }
  .src-toggle button.active { background: var(--accent-dk); color: var(--accent); }
  .src-toggle button:hover:not(.active) { color: var(--ink); background: var(--panel-2); }
  /* ── Lua editor ─────────────────────────────────────── */
  .lua-editor {
    font-family: var(--mono) !important; font-size: 12px !important;
    line-height: 1.5 !important; tab-size: 2;
    background: var(--bg) !important; color: var(--ink-bold) !important;
    border-color: var(--line) !important; min-height: 180px !important;
  }

  /* ── probe file autocomplete ────────────────────────── */
  .ac-wrap { position: relative; }
  .ac-list {
    display: none; position: absolute; top: 100%; left: 0; right: 0; z-index: 100;
    background: var(--raised); border: 1px solid var(--line); border-radius: 0 0 7px 7px;
    max-height: 180px; overflow-y: auto; box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }
  .ac-list.open { display: block; }
  .ac-item {
    font-family: var(--mono); font-size: 12px; padding: 7px 12px;
    color: var(--ink); cursor: pointer; border-bottom: 1px solid var(--line-soft);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .ac-item:last-child { border-bottom: none; }
  .ac-item:hover, .ac-item.active { background: var(--accent-dk); color: var(--accent); }
  .ac-item .hl { color: var(--accent); font-weight: 600; }
  select { appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--dim) 50%), linear-gradient(135deg, var(--dim) 50%, transparent 50%);
    background-position: calc(100% - 16px) 18px, calc(100% - 11px) 18px;
    background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }

  .fb-editor { display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
  .fb-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; }
  .fb-row button { padding: 0 12px; }
  .mini { font-family: var(--mono); font-size: 11px; color: var(--dim); background: transparent; border: 1px solid var(--line); border-radius: 7px; padding: 8px 12px; cursor: pointer; transition: all .15s; align-self: flex-start; }
  .mini:hover { color: var(--ink); border-color: var(--dim); }

  .form-err { display: none; color: var(--down); font-size: 11.5px; letter-spacing: .3px; margin-top: 4px; }
  .form-err.show { display: block; }

  .modal .foot { display: flex; gap: 10px; justify-content: flex-end; padding: 16px 22px; border-top: 1px solid var(--line); }
  .btn { font-family: var(--mono); font-size: 12px; letter-spacing: 1px; padding: 9px 18px; border-radius: 8px; cursor: pointer; transition: all .16s; border: 1px solid var(--line); background: transparent; color: var(--dim); }
  .btn:hover { color: var(--ink); border-color: var(--dim); }
  .btn.primary { color: #04140f; background: var(--accent); border-color: var(--accent); font-weight: 700; }
  .btn.primary:hover { box-shadow: 0 0 0 3px rgba(70,230,201,0.2); filter: brightness(1.05); }
  .btn.danger { color: var(--down); border-color: rgba(248,97,90,0.4); }
  .btn.danger:hover { background: var(--down); color: #1a0605; border-color: var(--down); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  .confirm-text { font-size: 13px; color: var(--ink); line-height: 1.6; }
  .confirm-text b { color: var(--ink-bold); }
  .confirm-text code { color: var(--ink); }
  .warn-box { margin-top: 14px; padding: 12px 14px; border-radius: 9px; border: 1px solid rgba(231,181,60,0.35); background: rgba(231,181,60,0.06); color: var(--low); font-size: 11.5px; letter-spacing: .3px; }
  .warn-box ul { margin: 6px 0 0; padding-left: 18px; }

  /* ── toasts ─────────────────────────────────────────────────── */
  .toasts { position: fixed; bottom: 22px; right: 22px; z-index: 80; display: flex; flex-direction: column; gap: 10px; }
  .toast { min-width: 220px; max-width: 360px; padding: 12px 16px; border-radius: 9px; background: var(--raised); border: 1px solid var(--line); box-shadow: var(--shadow); font-size: 12px; letter-spacing: .3px; display: flex; align-items: center; gap: 10px; animation: toastin .3s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes toastin { from { opacity: 0; transform: translateX(24px) } to { opacity: 1; transform: none } }
  .toast.out { animation: toastout .3s ease forwards; }
  @keyframes toastout { to { opacity: 0; transform: translateX(24px) } }
  .toast .tbar { width: 3px; align-self: stretch; border-radius: 3px; }
  .toast.ok  .tbar { background: var(--live); }
  .toast.err .tbar { background: var(--down); }
  .toast b { color: var(--ink-bold); font-weight: 600; }
</style>
</head>
<body>
  <header class="masthead">
    <div class="brand">
      <span class="mark">AI·API·<b>BRIDGE</b></span>
      <span class="signal"><i></i><i></i><i></i></span>
      <span class="sub">control plane</span>
    </div>
    <div class="spacer"></div>
    <div class="auth-chip" id="usageChip" title="Toggle cost/usage tracking (runtime)">
      <span class="dot"></span><span id="usageLabel">USAGE —</span>
    </div>
    <div class="auth-chip" id="authChip" title="Set or change the admin token">
      <span class="dot"></span><span id="authLabel">NO TOKEN</span>
    </div>
  </header>

  <main>
    <section id="providersSection">
      <div class="sec-head">
        <span class="idx">01</span>
        <h2>Providers</h2>
        <span class="count" id="provCount">—</span>
        <span class="rule"></span>
        <button class="add" id="addProvider">+ NEW PROVIDER</button>
      </div>
      <div class="grid" id="providers"><div class="loading">loading providers…</div></div>
    </section>

    <section id="routesSection">
      <div class="sec-head">
        <span class="idx">02</span>
        <h2>Routes</h2>
        <span class="count" id="routeCount">—</span>
        <span class="rule"></span>
        <button class="add" id="addRoute">+ NEW ROUTE</button>
      </div>
      <div class="grid" id="routes"><div class="loading">loading routes…</div></div>
    </section>
  </main>

  <!-- ── provider modal ─────────────────────────────────────── -->
  <div class="scrim" id="providerScrim">
    <div class="modal">
      <h3><span class="tag" id="provModalTag">NEW</span><span id="provModalTitle">Provider</span></h3>
      <form id="providerForm" autocomplete="off">
        <div class="body">
          <div class="field row2">
            <div>
              <label>Name <span class="opt">(immutable)</span></label>
              <input name="name" placeholder="e.g. zen" />
            </div>
            <div>
              <label>Wire format</label>
              <select name="wire">
                <option value="openai-chat">openai-chat</option>
                <option value="openai-responses">openai-responses</option>
                <option value="anthropic-messages">anthropic-messages</option>
              </select>
            </div>
          </div>
          <div class="field">
            <label>Base URL</label>
            <input name="base_url" placeholder="https://opencode.ai/zen/v1" />
          </div>
          <div class="field row2">
            <div>

<script>
"use strict";
/* ── tiny DOM builder (textContent only — no innerHTML anywhere) ── */
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k === "style") e.setAttribute("style", v);
    else if (k === "dataset") for (const d in v) e.dataset[d] = v[d];
    else if (k.startsWith("on") && typeof v === "function") e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    e.appendChild(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return e;
}
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

/* ── state ─────────────────────────────────────────────────────── */
const TOKEN_KEY = "bridge_admin_token";
const state = {
  token: localStorage.getItem(TOKEN_KEY) || "",
  providers: [],
  routes: [],
  modalOpen: false,
  costTracking: false,
};

/* ── api ───────────────────────────────────────────────────────── */
async function api(method, path, body) {
  const headers = {};
  if (body !== undefined) headers["content-type"] = "application/json";
  if (state.token) headers["authorization"] = "Bearer " + state.token;
  const res = await fetch(path, { method, headers, body: body !== undefined ? JSON.stringify(body) : undefined });
  if (res.status === 401) { openToken(true); throw new Error("Unauthorized — set the admin token."); }
  let data = null;
  try { data = await res.json(); } catch (_) {}
  if (!res.ok) throw new Error((data && data.error && data.error.message) || (res.status + " " + res.statusText));
  return data;
}

/* ── helpers ───────────────────────────────────────────────────── */
function pillFor(p) {
  const s = p.status || {};
  if (!p.probe_enabled) return { cls: "idle", label: "UNMONITORED" };
  if (s.last_checked == null) return { cls: "pending", label: "PENDING" };
  if (!s.available) return { cls: "down", label: "DOWN" };
  if (s.quota_remaining != null && p.quota_min != null && s.quota_remaining < p.quota_min)
    return { cls: "low", label: "LOW QUOTA" };
  return { cls: "live", label: "LIVE" };
}
const SEAM = { live: "var(--live)", low: "var(--low)", down: "var(--down)", pending: "var(--pending)", idle: "var(--idle)" };
function fmtNum(n) { return n == null ? "—" : (Math.round(n * 100) / 100).toLocaleString(); }
function ago(ts) {
  if (ts == null) return "never";
  const d = Date.now() / 1000 - ts;
  if (d < 60) return Math.max(0, Math.floor(d)) + "s ago";
  if (d < 3600) return Math.floor(d / 60) + "m ago";
  if (d < 86400) return Math.floor(d / 3600) + "h ago";
  return Math.floor(d / 86400) + "d ago";
}
function fmtUnit(unit, n) {
  if (unit === "usd") return "$" + fmtNum(n);
  if (unit === "requests") return Math.round(n) + " req";
  if (unit === "tokens") return fmtNum(n) + " tok";
  return fmtNum(n);
}
function fmtDur(secs) {
  if (secs == null) return "—";
  secs = Math.max(0, secs);
  const h = Math.floor(secs / 3600), m = Math.floor((secs % 3600) / 60);
  if (h >= 24) return Math.floor(h / 24) + "d " + (h % 24) + "h";
  return h > 0 ? h + "h " + m + "m" : m + "m";
}
function chip(label, boldVal) { return el("span", { class: "chip" }, label + " ", el("b", { text: boldVal })); }
function emptyState(title, hint) { return el("div", { class: "empty" }, title, hint ? el("div", { class: "hint", text: hint }) : false); }

/* ── render: providers ─────────────────────────────────────────── */
function providerCard(p) {
  const pill = pillFor(p);
  const s = p.status || {};
  const card = el("div", { class: "card", style: "--seam:" + SEAM[pill.cls] });

  card.appendChild(el("div", { class: "top" },
    el("span", { class: "pill " + pill.cls }, el("span", { class: "led" }), pill.label),
    el("span", { class: "name", text: p.name }),
    el("span", { class: "wire-tag", text: p.wire }),
    el("span", { class: "actions" },
      el("button", { class: "icon-btn", dataset: { editProv: p.name }, text: "edit" }),
      el("button", { class: "icon-btn danger", dataset: { delProv: p.name }, text: "del" }),
    ),
  ));

  const chips = el("div", { class: "chips" });
  if (p.model_prefix) chips.appendChild(chip("prefix", p.model_prefix));
  chips.appendChild(chip("max-tokens", p.max_tokens_field));
  if (p.api_key_set) chips.appendChild(chip("key", "set"));
  const hdrs = Object.keys(p.extra_headers || {}).length;
  if (hdrs) chips.appendChild(el("span", { class: "chip" }, el("b", { text: String(hdrs) }), " hdr" + (hdrs > 1 ? "s" : "")));
  if (p.probe_source === "text" && p.probe_script_text) chips.appendChild(chip("probe", "inline"));
  else if (p.probe_script) chips.appendChild(chip("probe", p.probe_script.split("/").pop()));
  if (p.quota_min != null) chips.appendChild(chip("floor", fmtNum(p.quota_min)));
  card.appendChild(el("div", { class: "meta" },
    el("div", { class: "urlrow" }, "↗ ", el("span", { class: "url", text: p.base_url })),
    chips,
  ));

  if (s.quota_remaining != null) {
    const hasLimit = s.quota_limit != null && s.quota_limit > 0;
    const pct = hasLimit ? Math.max(0, Math.min(100, (s.quota_remaining / s.quota_limit) * 100)) : 100;
    const barCls = pill.cls === "down" ? "down" : pill.cls === "low" ? "low" : "live";
    card.appendChild(el("div", { class: "quota" },
      el("div", { class: "lbl" },
        el("span", { text: "QUOTA" }),
        el("span", {}, el("b", { text: fmtNum(s.quota_remaining) }), hasLimit ? " / " + fmtNum(s.quota_limit) + " remaining" : " remaining"),
      ),
      hasLimit ? el("div", { class: "bar" }, el("span", { class: barCls, style: "width:" + pct + "%" })) : false,
    ));
  }
  if (state.costTracking && Array.isArray(p.usage) && p.usage.length) {
    const box = el("div", { class: "cost" });
    p.usage.forEach((u) => {
      const unit = u.unit || "usd";
      box.appendChild(el("div", { class: "cost-head", text: (u.usage_type || "usage").toUpperCase() + " · " + unit }));
      (u.windows || []).forEach((w) => {
        const limit = w.limit || 0;
        const spent = w.spent || 0;
        const remaining = w.remaining != null ? w.remaining : Math.max(0, limit - spent);
        const pct = limit > 0 ? Math.max(0, Math.min(100, (spent / limit) * 100)) : 0;
        const cls = remaining <= 0 ? "down" : remaining < limit * 0.25 ? "low" : "live";
        box.appendChild(el("div", { class: "cost-row" },
          el("div", { class: "lbl" },
            el("span", { class: "cw-label", text: w.label }),
            el("span", {}, el("b", { text: fmtUnit(unit, spent) }), " / " + fmtUnit(unit, limit)),
            el("span", { class: "cw-reset", text: remaining <= 0 ? "exhausted · +" + fmtDur(w.reset_in_secs) : fmtUnit(unit, remaining) + " left" }),
          ),
          el("div", { class: "bar" }, el("span", { class: cls, style: "width:" + pct + "%" })),
        ));
      });
    });
    card.appendChild(box);
  }
  if (s.error && !s.available) card.appendChild(el("div", { class: "err-note", text: "⚠ " + s.error }));
  if (p.probe_enabled) card.appendChild(el("div", { class: "last", text: "⟲ probed " + ago(s.last_checked) + (s.note ? " · " + s.note : "") }));
  return card;
}
function renderProviders() {
  $("#provCount").textContent = "[ " + state.providers.length + " ]";
  const wrap = $("#providers");
  if (!state.providers.length) { wrap.replaceChildren(emptyState("NO PROVIDERS", "Add an upstream account to route traffic through.")); return; }
  wrap.replaceChildren(...state.providers.map(providerCard));
}

/* ── render: routes ────────────────────────────────────────────── */
function routeRow(r) {
  const row = el("div", { class: "route" },
    el("span", { class: "alias", text: r.alias }),
    el("span", { class: "arrow", text: "→" }),
    el("span", { class: "target" }, el("span", { class: "prov", text: r.provider }), el("span", { class: "model", text: "/ " + r.model })),
  );
  if ((r.fallback || []).length) {
    const fbs = el("span", { class: "fallbacks" });
    r.fallback.forEach((f) => fbs.appendChild(el("span", { class: "fb" }, el("b", { text: f.provider }), "/" + f.model)));
    row.appendChild(el("span", { class: "arrow", text: "⤳" }));
    row.appendChild(fbs);
  }
  row.appendChild(el("span", { class: "actions" },
    el("button", { class: "icon-btn", dataset: { editRoute: r.alias }, text: "edit" }),
    el("button", { class: "icon-btn danger", dataset: { delRoute: r.alias }, text: "del" }),
  ));
  return row;
}
function renderRoutes() {
  $("#routeCount").textContent = "[ " + state.routes.length + " ]";
  const wrap = $("#routes");
  if (!state.routes.length) { wrap.replaceChildren(emptyState("NO ROUTES", "Map an alias clients request to a provider + model.")); return; }
  wrap.replaceChildren(...state.routes.map(routeRow));
}

/* ── load ──────────────────────────────────────────────────────── */
async function loadAll() {
  try {
    const [pr, ro] = await Promise.all([api("GET", "/admin/api/providers"), api("GET", "/admin/api/routes")]);
    state.providers = pr.providers || [];
    state.routes = ro.routes || [];
    state.costTracking = !!pr.cost_tracking;
    syncUsageChip();
    renderProviders(); renderRoutes();
  } catch (e) {
    if (e.message.startsWith("Unauthorized")) return;
    $("#providers").replaceChildren(emptyState("⚠ " + e.message, ""));
    toast("err", "Load failed", e.message);
  }
}
async function refreshProviders() {
  if (state.modalOpen) return;
  try {
    const pr = await api("GET", "/admin/api/providers");
    state.providers = pr.providers || [];
    state.costTracking = !!pr.cost_tracking;
    syncUsageChip();
    renderProviders();
  } catch (_) { /* silent on background refresh */ }
}

function syncUsageChip() {
  const chip = $("#usageChip");
  const on = state.costTracking;
  chip.classList.toggle("set", on);
  $("#usageLabel").textContent = on ? "USAGE ON" : "USAGE OFF";
}
$("#usageChip").addEventListener("click", async () => {
  try {
    const r = await api("POST", "/admin/api/usage", { enabled: !state.costTracking });
    state.costTracking = !!r.enabled;
    syncUsageChip();
    toast("ok", "Usage tracking " + (state.costTracking ? "on" : "off"), "");
    await loadAll();
  } catch (e) {
    if (!e.message.startsWith("Unauthorized")) toast("err", "Toggle failed", e.message);
  }
});

/* ── modal plumbing ────────────────────────────────────────────── */
function openScrim(id) { $(id).classList.add("open"); state.modalOpen = true; }
function closeScrims() { $$(".scrim").forEach((s) => s.classList.remove("open")); state.modalOpen = false; }
document.addEventListener("click", (e) => { if (e.target.classList.contains("scrim") || e.target.hasAttribute("data-close")) closeScrims(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeScrims(); });

/* ── provider modal ────────────────────────────────────────────── */
let editingProvider = null;
function openProviderModal(name) {
  const f = $("#providerForm");
  f.reset();
  $("#provFormErr").classList.remove("show");
  editingProvider = name || null;
  const isEdit = !!name;
  $("#provModalTag").textContent = isEdit ? "EDIT" : "NEW";
  $("#provModalTitle").textContent = isEdit ? name : "New provider";
  $("#provSubmit").textContent = isEdit ? "Update provider" : "Create provider";
  f.name.disabled = isEdit;
  $("#apiKeyHint").textContent = isEdit ? "(blank = keep current)" : "(optional)";
  if (isEdit) {
    const p = state.providers.find((x) => x.name === name);
    f.name.value = p.name;
    f.wire.value = p.wire;
    f.base_url.value = p.base_url;
    f.api_key.value = "";
    f.api_key.placeholder = p.api_key_set ? "•••••••• (set — blank keeps it)" : "sk-…";
    f.model_prefix.value = p.model_prefix || "";
    f.max_tokens_field.value = p.max_tokens_field || "";
    f.quota_min.value = p.quota_min != null ? p.quota_min : "";
    f.extra_headers.value = JSON.stringify(p.extra_headers || {}, null, 2);
    f.probe_script.value = p.probe_script || "";
    f.probe_script_text.value = p.probe_script_text || "";
    // Set source toggle
    const src = p.probe_source || "path";
    $$("#probeSrcToggle button").forEach(b => b.classList.toggle("active", b.dataset.src === src));
    toggleProbeSource(src);
    f.probe_enabled.value = p.probe_enabled_override === true ? "on" : p.probe_enabled_override === false ? "off" : "auto";
    f.probe_interval_secs.value = p.probe_interval_secs != null ? p.probe_interval_secs : "";
    // reconstruct the editable usage specs — drop runtime spent/remaining/reset/unit
    f.usage.value = JSON.stringify(
      (p.usage || []).map((u) => {
        const spec = {
          usage_type: u.usage_type,
          windows: (u.windows || []).map((w) => ({ label: w.label, window_secs: w.window_secs, limit: w.limit })),
        };
        if (u.model_prices) spec.model_prices = u.model_prices;
        return spec;
      }),
      null, 2,
    );
  } else {
    f.api_key.placeholder = "sk-…";
    f.max_tokens_field.placeholder = "max_tokens";
    f.probe_script_text.value = "";
    $$("#probeSrcToggle button").forEach(b => b.classList.toggle("active", b.dataset.src === "path"));
    toggleProbeSource("path");
  }
  openScrim("#providerScrim");
}


/* ── probe file autocomplete ────────────────────────────── */
let probeFiles = [];
let probeFileFilter = "";
let probeFileIdx = -1;

async function loadProbeFiles() {
  try { const r = await api("GET", "/admin/api/probes"); probeFiles = r.files || []; }
  catch (_) { probeFiles = []; }
}
loadProbeFiles();

function fuzzyMatch(pat, str) {
  pat = pat.toLowerCase(); str = str.toLowerCase();
  let pi = 0;
  for (let si = 0; si < str.length && pi < pat.length; si++) {
    if (str[si] === pat[pi]) pi++;
  }
  return pi === pat.length;
}

function renderProbeList(filter) {
  const list = $("#probeScriptList");
  list.innerHTML = "";
  probeFileIdx = -1;
  if (!filter) { list.classList.remove("open"); return; }
  const matches = probeFiles.filter(f => fuzzyMatch(filter, f)).slice(0, 12);
  if (!matches.length) { list.classList.remove("open"); return; }
  matches.forEach((f, i) => {
    const item = el("div", { class: "ac-item", dataset: { idx: i }, text: f });
    // highlight matching chars
    const lower = f.toLowerCase(); const pat = filter.toLowerCase();
    let html = ""; let pi = 0;
    for (let si = 0; si < lower.length && pi < pat.length; si++) {
      if (lower[si] === pat[pi]) { html += '<span class="hl">' + f[si] + '</span>'; pi++; }
      else html += f[si];
    }
    html += f.slice(lower.indexOf(pat[pat.length - 1]) + 1);
    // simpler: just use textContent, highlight via innerHTML rebuild
    item.innerHTML = highlightMatch(f, filter);
    item.addEventListener("mousedown", (e) => {
      e.preventDefault();
      selectProbeFile(f);
    });
    list.appendChild(item);
  });
  list.classList.add("open");
}

function highlightMatch(str, pat) {
  if (!pat) return str;
  const lower = str.toLowerCase(); const p = pat.toLowerCase();
  let out = ""; let pi = 0;
  for (let i = 0; i < str.length; i++) {
    if (pi < p.length && lower[i] === p[pi]) {
      out += '<span class="hl">' + str[i] + '</span>';
      pi++;
    } else {
      out += str[i];
    }
  }
  return out;
}

function selectProbeFile(name) {
  const inp = $("#probeScriptInput");
  inp.value = name;
  $("#probeScriptList").classList.remove("open");
  probeFileIdx = -1;
  inp.focus();
}

$("#probeScriptInput").addEventListener("input", () => {
  const v = $("#probeScriptInput").value;
  probeFileFilter = v;
  renderProbeList(v);
});
$("#probeScriptInput").addEventListener("keydown", (e) => {
  const list = $("#probeScriptList");
  const items = list.querySelectorAll(".ac-item");
  if (!list.classList.contains("open")) return;
  if (e.key === "ArrowDown") {
    e.preventDefault();
    probeFileIdx = Math.min(probeFileIdx + 1, items.length - 1);
    items.forEach((it, i) => it.classList.toggle("active", i === probeFileIdx));
  } else if (e.key === "ArrowUp") {
    e.preventDefault();
    probeFileIdx = Math.max(probeFileIdx - 1, -1);
    items.forEach((it, i) => it.classList.toggle("active", i === probeFileIdx));
  } else if (e.key === "Enter") {
    e.preventDefault();
    if (probeFileIdx >= 0 && items[probeFileIdx]) {
      selectProbeFile(items[probeFileIdx].dataset.idx !== undefined
        ? probeFiles.find((_, i) => i === parseInt(items[probeFileIdx].dataset.idx)) || items[probeFileIdx].textContent
        : items[probeFileIdx].textContent);
    }
  } else if (e.key === "Escape") {
    list.classList.remove("open");
  }
});
$("#probeScriptInput").addEventListener("blur", () => {
  setTimeout(() => $("#probeScriptList").classList.remove("open"), 150);
});
document.addEventListener("click", (e) => {
  if (!e.target.closest("#probeScriptInput") && !e.target.closest("#probeScriptList")) {
    $("#probeScriptList").classList.remove("open");
  }
});

function toggleProbeSource(src) {
  const pathRow = $("#probePathRow");
  const textRow = $("#probeTextRow");
  const label = $("#probeSrcLabel");
  if (src === "text") {
    pathRow.style.display = "none";
    textRow.style.display = "";
    label.textContent = " — source: text";
  } else {
    pathRow.style.display = "";
    textRow.style.display = "none";
    label.textContent = " — source: path";
  }
}
$("#probeSrcToggle").addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  const src = btn.dataset.src;
  $$("#probeSrcToggle button").forEach(b => b.classList.toggle("active", b.dataset.src === src));
  toggleProbeSource(src);
});

$("#providerForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = e.target;
  const errEl = $("#provFormErr");
  errEl.classList.remove("show");
  const p = { wire: f.wire.value, base_url: f.base_url.value.trim() };
  if (!editingProvider) p.name = f.name.value.trim();
  if (f.api_key.value) p.api_key = f.api_key.value;
  const mp = f.model_prefix.value.trim(); if (mp) p.model_prefix = mp;
  const mtf = f.max_tokens_field.value.trim(); if (mtf) p.max_tokens_field = mtf;
  try { p.extra_headers = f.extra_headers.value.trim() ? JSON.parse(f.extra_headers.value) : {}; }
  catch (_) { errEl.textContent = "Extra headers must be valid JSON."; errEl.classList.add("show"); return; }
  try { p.usage = f.usage.value.trim() ? JSON.parse(f.usage.value) : []; }
  catch (_) { errEl.textContent = "Usage must be valid JSON (array of typed specs)."; errEl.classList.add("show"); return; }
  const ps = f.probe_script.value.trim();
  const src = $$("#probeSrcToggle button.active")[0]?.dataset?.src || "path";
  if (ps && src === "path") p.probe_script = ps;
  p.probe_source = src;
  if (src === "text") {
    const pt = f.probe_script_text.value.trim();
    if (pt) p.probe_script_text = pt;
  }
  if (f.probe_enabled.value === "on") p.probe_enabled = true;
  else if (f.probe_enabled.value === "off") p.probe_enabled = false;
  const pi = f.probe_interval_secs.value.trim(); if (pi) p.probe_interval_secs = parseInt(pi, 10);
  const qm = f.quota_min.value.trim(); if (qm) p.quota_min = parseFloat(qm);

  $("#provSubmit").disabled = true;
  try {
    if (editingProvider) await api("PUT", "/admin/api/providers/" + encodeURIComponent(editingProvider), p);
    else await api("POST", "/admin/api/providers", p);
    closeScrims();
    toast("ok", editingProvider ? "Provider updated" : "Provider created", p.name || editingProvider);
    await loadAll();
  } catch (err) {
    errEl.textContent = err.message; errEl.classList.add("show");
  } finally { $("#provSubmit").disabled = false; }
});

/* ── route modal ───────────────────────────────────────────────── */
let editingRoute = null;
function fillProviderSelect(select, selected) {
  select.replaceChildren(...state.providers.map((p) => {
    const o = el("option", { value: p.name, text: p.name });
    if (p.name === selected) o.selected = true;
    return o;
  }));
}
function addFbRow(provider, model) {
  const sel = el("select", { class: "fb-prov" });
  fillProviderSelect(sel, provider);
  const row = el("div", { class: "fb-row" },
    sel,
    el("input", { class: "fb-model", placeholder: "model", value: model || "" }),
    el("button", { type: "button", class: "mini", title: "remove", text: "✕" }),
  );
  row.querySelector("button").addEventListener("click", () => row.remove());
  $("#fbEditor").appendChild(row);
}
function openRouteModal(alias) {
  const f = $("#routeForm");
  f.reset();
  $("#routeFormErr").classList.remove("show");
  $("#fbEditor").replaceChildren();
  editingRoute = alias || null;
  const isEdit = !!alias;
  $("#routeModalTag").textContent = isEdit ? "EDIT" : "NEW";
  $("#routeModalTitle").textContent = isEdit ? alias : "New route";
  $("#routeSubmit").textContent = isEdit ? "Update route" : "Create route";
  f.alias.disabled = isEdit;
  if (isEdit) {
    const r = state.routes.find((x) => x.alias === alias);
    f.alias.value = r.alias;
    fillProviderSelect($("#routeProvider"), r.provider);
    f.model.value = r.model;
    (r.fallback || []).forEach((fb) => addFbRow(fb.provider, fb.model));
  } else {
    fillProviderSelect($("#routeProvider"));
  }
  openScrim("#routeScrim");
}
$("#addFb").addEventListener("click", () => addFbRow());
$("#routeForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = e.target;
  const errEl = $("#routeFormErr");
  errEl.classList.remove("show");
  const r = { provider: f.provider.value, model: f.model.value.trim(), fallback: [] };
  if (!editingRoute) r.alias = f.alias.value.trim();
  r.fallback = $$("#fbEditor .fb-row").map((row) => ({
    provider: row.querySelector(".fb-prov").value,
    model: row.querySelector(".fb-model").value.trim(),
  })).filter((x) => x.provider && x.model);

  $("#routeSubmit").disabled = true;
  try {
    if (editingRoute) await api("PUT", "/admin/api/routes/" + encodeURIComponent(editingRoute), r);
    else await api("POST", "/admin/api/routes", r);
    closeScrims();
    toast("ok", editingRoute ? "Route updated" : "Route created", r.alias || editingRoute);
    await loadAll();
  } catch (err) {
    errEl.textContent = err.message; errEl.classList.add("show");
  } finally { $("#routeSubmit").disabled = false; }
});

/* ── confirm / delete ──────────────────────────────────────────── */
let pendingDelete = null;
function openConfirm(kind, id) {
  pendingDelete = { kind, id };
  const warn = $("#confirmWarn");
  warn.replaceChildren();
  if (kind === "provider") {
    $("#confirmTitle").textContent = "Delete provider";
    $("#confirmText").replaceChildren("Permanently delete provider ", el("b", { text: id }), "?");
    const affected = state.routes.filter((r) => r.provider === id || (r.fallback || []).some((f) => f.provider === id));
    if (affected.length) {
      const ul = el("ul");
      affected.forEach((r) => ul.appendChild(el("li", { text: r.alias })));
      warn.appendChild(el("div", { class: "warn-box" }, "⚠ This cascades — routes referencing it will be affected:", ul));
    }
  } else {
    $("#confirmTitle").textContent = "Delete route";
    $("#confirmText").replaceChildren("Permanently delete route ", el("b", { text: id }), "?");
  }
  openScrim("#confirmScrim");
}
$("#confirmDelete").addEventListener("click", async () => {
  if (!pendingDelete) return;
  const { kind, id } = pendingDelete;
  $("#confirmDelete").disabled = true;
  try {
    const path = kind === "provider" ? "/admin/api/providers/" : "/admin/api/routes/";
    await api("DELETE", path + encodeURIComponent(id));
    closeScrims();
    toast("ok", (kind === "provider" ? "Provider" : "Route") + " deleted", id);
    await loadAll();
  } catch (err) {
    toast("err", "Delete failed", err.message);
  } finally { $("#confirmDelete").disabled = false; pendingDelete = null; }
});

/* ── token ─────────────────────────────────────────────────────── */
function syncAuthChip() {
  const chip = $("#authChip");
  if (state.token) { chip.classList.add("set"); $("#authLabel").textContent = "TOKEN SET"; }
  else { chip.classList.remove("set"); $("#authLabel").textContent = "NO TOKEN"; }
}
function openToken(fromAuthFail) {
  $("#tokenInput").value = state.token;
  if (fromAuthFail) toast("err", "Auth required", "Enter the bridge admin token.");
  openScrim("#tokenScrim");
}
$("#authChip").addEventListener("click", () => openToken(false));
$("#tokenClear").addEventListener("click", () => {
  state.token = ""; localStorage.removeItem(TOKEN_KEY); syncAuthChip(); closeScrims();
  toast("ok", "Token cleared", ""); loadAll();
});
$("#tokenForm").addEventListener("submit", (e) => {
  e.preventDefault();
  state.token = $("#tokenInput").value.trim();
  if (state.token) localStorage.setItem(TOKEN_KEY, state.token);
  else localStorage.removeItem(TOKEN_KEY);
  syncAuthChip(); closeScrims(); loadAll();
});

/* ── toasts ────────────────────────────────────────────────────── */
function toast(kind, title, msg) {
  const node = el("div", { class: "toast " + kind },
    el("span", { class: "tbar" }),
    el("span", {}, el("b", { text: title }), msg ? " · " + msg : ""),
  );
  $("#toasts").appendChild(node);
  setTimeout(() => { node.classList.add("out"); setTimeout(() => node.remove(), 320); }, 3600);
}

/* ── events ────────────────────────────────────────────────────── */
$("#addProvider").addEventListener("click", () => openProviderModal());
$("#addRoute").addEventListener("click", () => {
  if (!state.providers.length) { toast("err", "Add a provider first", "Routes need a provider to point at."); return; }
  openRouteModal();
});
document.addEventListener("click", (e) => {
  const t = e.target;
  if (t.dataset && t.dataset.editProv) openProviderModal(t.dataset.editProv);
  else if (t.dataset && t.dataset.delProv) openConfirm("provider", t.dataset.delProv);
  else if (t.dataset && t.dataset.editRoute) openRouteModal(t.dataset.editRoute);
  else if (t.dataset && t.dataset.delRoute) openConfirm("route", t.dataset.delRoute);
});

/* ── boot ──────────────────────────────────────────────────────── */
syncAuthChip();
loadAll();
setInterval(refreshProviders, 5000);
</script>
</body>
</html>
