# ai-api-bridge configuration. Copy to `bridge.toml` and edit.
# Full reference: docs/configuration.md
#
# One running bridge serves BOTH clients at once, sharing the [[routes]] below:
#   - Codex       -> POST /v1/responses  (~/.codex/config.toml, wire_api="responses")
#   - Claude Code -> POST /v1/messages   (ANTHROPIC_BASE_URL + ANTHROPIC_MODEL)
#
# Keys for a provider can be supplied inline (`api_key = "..."`) or — preferred —
# via the environment variable BRIDGE_PROVIDERS_<NAME>_API_KEY, e.g.
#   export BRIDGE_PROVIDERS_ZEN_API_KEY=...      # for [providers.zen]
#   export BRIDGE_PROVIDERS_GO_API_KEY=...       # for [providers.go]

listen = "127.0.0.1:8282"
# SQLite DB for providers + routes. The [providers.*] / [[routes]] below SEED this DB on
# first run; after that the DB is authoritative (edit it, or re-run with --reseed to
# re-import from this file). listen/default_provider/auth_token are always read from here.
database = "bridge.db"
default_provider = "zen"
# Global safety-net route: appended as the LAST candidate of every route's chain
# (serves the request when everything else is down/exhausted/failing) and catches
# unrouted model names when default_provider is unset. Seeds the DB on first run;
# after that edit it on the admin page (or PUT /admin/api/fallback_route).
# fallback_route = { provider = "go", model = "deepseek-v4-flash" }
# Require clients to send the token: `Authorization: Bearer <auth_token>` (Codex's env_key)
# or `x-api-key: <auth_token>` (Claude Code's ANTHROPIC_API_KEY). Unset = accept any/no token.
# auth_token = "set-me-to-a-long-random-string"
# Cost/usage tracking master switch (default false = OFF). Off = no cost recorded,
# no usage_events written, cost_windows hidden from /v1/providers, and no usage-based
# failover — all at zero overhead. **Reactive 429 failover is unaffected.** This sets
# the startup default; toggle at runtime on the admin page or via
# `POST /admin/api/usage {"enabled": true}` (runtime-only — reverts to this on restart).
cost_tracking = false

# ----------------------------------------------------------------------------
# OpenCode Zen — the standard gateway (OpenAI/Anthropic/Gemini models).
# (These provider/route blocks seed the SQLite DB above on first run.)
# Models use the `opencode/<id>` form, so model_prefix adds it automatically.
# ----------------------------------------------------------------------------
[providers.zen]
wire = "openai-chat"
base_url = "https://opencode.ai/zen/v1"
model_prefix = "opencode/"          # gpt-5.5 -> opencode/gpt-5.5
# api_key = "..."                   # prefer BRIDGE_PROVIDERS_ZEN_API_KEY
# max_tokens_field = "max_tokens"   # or "max_completion_tokens"

# ----------------------------------------------------------------------------
# OpenCode "go" package — a separate plan/endpoint with its own API key and a
# different model line-up. Model ids are passed through as-is (model_prefix="").
#
# Models available on the go package (GET /zen/go/v1/models):
#   deepseek-v4-pro   deepseek-v4-flash
#   glm-5.1           glm-5
#   kimi-k2.6         kimi-k2.5
#   minimax-m3        minimax-m2.7      minimax-m2.5
#   qwen3.7-max       qwen3.7-plus      qwen3.6-plus      qwen3.5-plus
#   mimo-v2-pro       mimo-v2-omni      mimo-v2.5-pro     mimo-v2.5
#   hy3-preview
#
# Thinking models (e.g. deepseek-v4-pro) work as-is — the bridge passes their
# reasoning_content back across turns automatically.
# ----------------------------------------------------------------------------
[providers.go]
wire = "openai-chat"
base_url = "https://opencode.ai/zen/go/v1"
model_prefix = ""                   # model names passed through unchanged
# api_key = "..."                   # prefer BRIDGE_PROVIDERS_GO_API_KEY
# --- watcher (optional): a Lua probe checks quota/availability; status at GET /v1/providers
probe_script = "probes/opencode-zen.lua"   # availability via /models (Zen has no quota API)
probe_interval_secs = 300
# quota_min = 1.0                   # for vendors with a real quota: failover when below this
# --- usage (optional): typed rolling limit windows. `usage_type` is billing ($),
# count (requests), or token. A window hitting remaining 0 (any unit) fails this
# provider over (before a 429). Spend/remaining per window show at GET /v1/providers
# and on the admin page. (Legacy `cost_windows`/`model_prices` still work — they fold
# into a `billing` spec at load.)
#
# billing: Zen has no usage API and Go reports cost=$0 (subscription), so the bridge
# estimates spend as tokens × model_prices (below). Real non-zero `cost` always wins.
[[providers.go.usage]]
usage_type = "billing"
windows = [
    { label = "5h", window_secs = 18000, limit = 12.0 },   # OpenCode Go: $12/5h
    { label = "7d", window_secs = 604800, limit = 30.0 },  #              $30/week
    { label = "30d", window_secs = 2592000, limit = 60.0 },#              $60/month
]

[providers.go.usage.model_prices]   # $/1M tokens — published Zen PAYG rates
"deepseek-v4-flash" = { input = 0.14, output = 0.28 }
"kimi-k2.6"         = { input = 0.95, output = 4.00 }
"kimi-k2.5"         = { input = 0.60, output = 3.00 }
"glm-5.1"           = { input = 1.40, output = 4.40 }
"glm-5"             = { input = 1.00, output = 3.20 }
"qwen3.7-max"       = { input = 2.50, output = 7.50 }
"qwen3.7-plus"      = { input = 0.40, output = 1.60 }
"qwen3.6-plus"      = { input = 0.50, output = 3.00 }
"qwen3.5-plus"      = { input = 0.20, output = 1.20 }
"minimax-m2.7"      = { input = 0.30, output = 1.20 }
"minimax-m2.5"      = { input = 0.30, output = 1.20 }
"deepseek-v4-pro"   = { input = 0.40, output = 1.60 }   # PLACEHOLDER — not in Zen's published pricing; verify

# count: cap request volume, e.g. 500 requests/day (example — adjust to your plan).
[[providers.go.usage]]
usage_type = "count"
windows = [{ label = "1d", window_secs = 86400, limit = 500.0 }]

# ----------------------------------------------------------------------------
# Routes map the model name a client sends (alias) to a provider + upstream
# model. An exact alias match wins; otherwise the default_provider is used and
# its model_prefix applied. Codex sends whatever `model` is set in ~/.codex/
# config.toml — point that alias here to choose which upstream model serves it.
# ----------------------------------------------------------------------------

# This single alias serves BOTH clients:
#   - Codex  (`/v1/responses`): set `model = "gpt-5.5"` in ~/.codex/config.toml
#   - Claude Code (`/v1/messages`): set ANTHROPIC_BASE_URL=http://127.0.0.1:8282
#       ANTHROPIC_MODEL=gpt-5.5  ANTHROPIC_API_KEY=<auth_token>
[[routes]]
alias = "gpt-5.5"
provider = "go"
model = "deepseek-v4-pro"
# Optional failover: if `go` is unavailable or below its quota_min, try these in order.
# fallback = [{ provider = "zen", model = "gpt-5.5" }]

# Add more aliases to switch models without touching Codex, e.g.:
# [[routes]]
# alias = "fast"
# provider = "go"
# model = "deepseek-v4-flash"
#
# [[routes]]
# alias = "glm"
# provider = "go"
# model = "glm-5.1"
